services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: securehr
      MYSQL_USER: securehr
      MYSQL_PASSWORD: securehr-dev-password
      MYSQL_ROOT_PASSWORD: root-dev-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      GIN_MODE: release
      DATABASE_DRIVER: mysql
      DATABASE_DSN: securehr:securehr-dev-password@tcp(mysql:3306)/securehr?charset=utf8mb4&parseTime=True&loc=Local
      JWT_SECRET: change-this-docker-development-secret
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 7
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Origin,Content-Type,Accept,Authorization
      CORS_ALLOW_CREDENTIALS: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
